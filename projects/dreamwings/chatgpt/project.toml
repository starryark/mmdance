# ChatGPT (the optimized model: a Tripo-generated, toon-shaded white dragon woman, 1 m tall) dancing
# 鸭梨P's MMD motion 梦的翅膀受了伤 (the meme's white-shirt part), in the Anthropic lobby, filmed by a
# camera solved from the reference video. The character setup (gown, hair locks, tail, hands,
# sleeves, wings, atlas face) is chatgpt_chika's. See ../README.md.

[project]
name = "DreamWingsChatGPT"
fps = 30
frame_start = 0
frame_end = 452

[paths]
character = "character/ChatGPT_optimized.blend"
blend = "build/DreamWings_ChatGPT.blend"
frames = "render/frames/dw_"
video = "build/DreamWings_ChatGPT.mp4"

[character]
rig = "ChatGPT_Rig"
body = "ChatGPT_Body"

[motion]
vmd = "source/VMD-TDA.vmd"
thumb_rest = [0.838, 0.395, 0.377]

[camera]
vmd = ""                                    # the solved camera is keyed by ../lobby.py (camera.track)
track = "../camera/camera_track.npz"

[audio]
file = "../audio/song.wav"

[face]
mode = "atlas"
vmd = "source/face.vmd"

# The facial track is ARKit-style capture with a few MMD names: winks for the eyes, ワ / お for the
# mouth. Names not in the track give zeros.
[face.morphs]
blink = "まばたき"
wink_left = "ウィンク"
wink_right = "ウィンク右"
smile = "笑い"
a = "あ"
i = "い"
u = "う"
e = "え"
o = "お"
wa = "ワ"
smirk = "にやり"

# Guide curves measured on ChatGPT_Face_D.png (2048 px), left to right. L is the image-left eye
# (her right eye): outer corner on the left. The lids are inpainted from the painting itself (soft
# lids; on the model's first face texture bang strands also crossed both eyes, until its face
# rebuild took them off the skin). Her eyes are tall with a deep lower lid: `lower` sits 8 px
# below the painted lid line, so a closed eye covers that line and shows the lash line only.
[face.atlas]
material = "ChatGPT_Face"
lids = "inpaint"
mouth_center = [995, 1678]
mouth_rect = [845, 1585, 1145, 1800]

[face.atlas.eyes.L]
lash_top = [[518, 1196], [545, 1174], [570, 1162], [595, 1154], [620, 1146], [645, 1150], [670, 1155], [695, 1156], [720, 1160], [745, 1164], [760, 1170], [770, 1168]]
lash_bot = [[518, 1238], [545, 1216], [570, 1200], [595, 1186], [620, 1172], [645, 1172], [670, 1172], [695, 1172], [720, 1175], [745, 1180], [760, 1188], [770, 1190]]
lower = [[518, 1252], [545, 1280], [570, 1304], [595, 1322], [620, 1336], [645, 1334], [670, 1330], [695, 1322], [720, 1302], [745, 1276], [760, 1196], [770, 1198]]

[face.atlas.eyes.R]
lash_top = [[1196, 1118], [1203, 1114], [1212, 1110], [1230, 1105], [1255, 1099], [1280, 1095], [1305, 1091], [1330, 1087], [1355, 1083], [1380, 1078], [1405, 1075], [1430, 1072], [1455, 1071], [1480, 1073], [1500, 1080]]
lash_bot = [[1196, 1168], [1203, 1166], [1212, 1158], [1230, 1150], [1255, 1142], [1280, 1137], [1305, 1133], [1330, 1132], [1355, 1131], [1380, 1131], [1405, 1130], [1430, 1127], [1455, 1125], [1480, 1125], [1500, 1134]]
lower = [[1196, 1174], [1203, 1176], [1212, 1240], [1230, 1272], [1255, 1300], [1280, 1312], [1305, 1317], [1330, 1319], [1355, 1321], [1380, 1321], [1405, 1319], [1430, 1309], [1455, 1272], [1480, 1198], [1500, 1140]]

[hair]
enabled = true
material = "ChatGPT_Hair"
rip_below = 0.78
# Her long wavy hair falls apart into many locks and curls below the shoulders: one chain per
# lock, so each swings on its own (as deepseek_chika).
mode = "locks"
split_z = 0.70
root_z = 0.80
joint_step = 0.045
lock_width = 16.0
min_lock = 45                               # thin strands lying on the dress's back (31-40 vertices,
                                            # close to the axis) follow the nearest lock

[physics.hair]
relative = true
elastic = [1.0, 0.55, 0.30, 0.18, 0.12, 0.09, 0.075, 0.065, 0.06]
stiff_lim = [0.0, 0.2, 0.35, 0.5, 0.65, 0.8, 0.9, 1.0, 1.1]
lying_relax = 0.6
tether = [0.0, 0.03, 0.07, 0.12, 0.17, 0.22, 0.27, 0.32, 0.37]
drag = 0.035
gravity_comp = 0.9
ring_mode = "range"
ring_min = 0.7
ring_max = 1.35
ring_stiff = 0.25
bend_chain = 0.15
bend_min = 0.9
smooth_frames = 0.8

# The gown: floor length with a short train and ruffled front edges. Only the dress material is
# skirt; the sleeves, wings and tail hanging beside it have their own materials.
[skirt]
enabled = true
materials = ["ChatGPT_Cloth"]
top = 0.64
rows_z = [0.62, 0.548, 0.476, 0.404, 0.332, 0.26, 0.188, 0.116, 0.044]

[physics.skirt]
elastic = [1.0, 0.24, 0.12, 0.075, 0.055, 0.045, 0.04, 0.035, 0.03]
ring_min = 0.92
ring_max = 1.15
ring_stiff = [0.0, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.85, 0.85]
bend_chain = 0.35
bend_ring = 0.25
drag = 0.035
absorb = 0.95
smooth_frames = 1.0

[legs]
min_top = 0.35
attach = 0.01                               # anklets and shoe ornaments are separate islands

# The tail is its own mesh island (cut off at its root by the model prep).
[tail]
enabled = true
seed = [0.27, 0.20, 0.25]
sway = [6.0, 31.5, 5.0]                     # a slow swish down the tail, two beats long (114 bpm)

[tail.physics]                              # muscular: firm at the root, free toward the tip
elastic = [1.0, 1.0, 0.45, 0.28, 0.18, 0.13, 0.10, 0.085, 0.075]
stiff_lim = [0.0, 0.0, 0.3, 0.42, 0.55, 0.65, 0.72, 0.8, 0.85]
lying_relax = 0.25
drag = 0.04
smooth_frames = 0.8

[hands]
enabled = true
material = "ChatGPT_Skin"
select = "wrist"                            # the skin material also covers her arms, legs and neck
skin_uv = [0.8302, 0.5378]                  # a clean spot of upper-arm skin in the body texture

[fixes]
nape_seam = true
cross_side_legs_below = 0.5
rigid_boots = true
rigid_boots_hips = true                     # her leg mesh reaches up to the pelvis

[stage]
builder = "../lobby.py"
world = "AIG_World"
sun = "AIG_Sun"                             # direction kept: the face shading driver reads it
# single-layer fabric: the inside in a darker shade of the print
lining = { ChatGPT_Cloth = [0.84, 0.82, 0.92], ChatGPT_Sleeve = [0.84, 0.82, 0.92], ChatGPT_Wing = [0.80, 0.78, 0.90] }

# The Anthropic lobby (../lobby.py). The characters are 1 m tall and the lobby real size: it is
# scaled by 1/1.6 around the dance, so they read as 1.6 m. Its spot center_lobby (between the
# slatted screens and the wall planters, lobby metres; tools/place_dance.py: 0.9 m clear of
# everything on the dance's and the camera's paths) goes onto center_dance (the middle of those
# paths, character metres). Rotation 180: the opening and ChatGPT's part look down the lobby at the
# tree and the ANTHROP\C wall; in between the camera turns past the glazing and the screens.
[stage.lobby]
file = "lobby/lobby.blend"
world = "World_Daylight"
scale = 0.625
rotation = 180.0
center_lobby = [1.0, 18.25]
center_dance = [0.52, 0.545]
character = "chatgpt"
key_elevation = 35.0                        # the character's key light: above the camera,
key_azimuth = 25.0                          # turned this far round from it (deg)
key_energy = 1.5
motion_blur = 0.5                           # shutter (frames); the reference's whip pans blur
view_transform = "Khronos PBR Neutral"         # base colours as painted (the toon look), highlights rolled off
look = "None"
exposure = 0.0
shadow_pool = "1024"                        # MB: the lobby has 58 shadowed lights


# The bell sleeves on their bone chains (sleeves.py): soft cloth that hangs from the forearm
# whatever the arm does. The joint springs only keep a little memory of the cut (at 0.1 a joint
# would beat gravity about 9 to 1 and the sleeve would turn with the forearm like a board), the
# angle limits are wide and the tether long, so gravity hangs the fabric once the arm turns.
# Full gravity always (the rest shape already hangs straight down). Linked across the columns,
# kept out of the body, the other arm and the skirt.
[stage.sleeves]
radius = 0.018
relative = true
elastic = [1.0, 0.012, 0.008, 0.006, 0.005, 0.005, 0.005]
stiff_lim = [0.0, 1.5, 1.8, 2.0, 2.0, 2.0, 2.0]
lying_relax = 0.0
tether = [0.0, 0.12, 0.24, 0.36, 0.48, 0.60, 0.70]
drag = 0.05
gravity_comp = 0.0
ring_mode = "range"
ring_min = 0.6
ring_max = 1.2
ring_stiff = 0.4
bend_chain = 0.2
bend_min = 0.9
edge_collide = true
absorb = 0.9
smooth_frames = 0.8

# The wings (wings.py): a slow beat [open, lift (deg), period (frames), outer-wing lag (frames)]
# and a sweep back against chest turns (deg per deg/frame, capped).
[stage.wings]
beat = [5.0, 4.0, 63.0, 6.0]                # four beats of the song (114 bpm)
drag = 1.2
drag_max = 14.0
