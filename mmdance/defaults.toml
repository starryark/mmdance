# Defaults for every project. A project's project.toml overrides any key here.
#
# Conventions: Blender units are metres, Z is up and the character faces -Y in a T-pose (arms
# along +-X). Lengths and heights below are in the character's rest pose. The shipped numbers
# suit a character about 1 m tall (the size Tripo exports); scale them for other sizes
# (`python -m mmdance inspect` prints suggestions).

[project]
name = "untitled"
fps = 30
frame_start = 0
frame_end = -1                 # -1: the last key of the motion VMD

[paths]                        # relative to the folder holding project.toml
character = ""                 # the rigged character .blend (read only, never modified)
cache = "cache"
textures = "textures"          # generated face atlases / cleaned face texture
blend = "build/scene.blend"    # the generated, animated scene
frames = "render/frames/frame_"   # PNG sequence prefix (frame number + .png is appended)
video = "build/video.mp4"

[tools]
python = "python"              # system Python with numpy, scipy, opencv-python, scikit-image, pillow
blender = "blender"
ffmpeg = "ffmpeg"

[character]
rig = ""                       # armature object; "" = the only armature in the file
body = ""                      # main skinned mesh; "" = the largest mesh deformed by the rig
outline_group = "Outline"      # vertex group of an outline shell, kept when re-weighting ("" = none)

[bones]
prefix = "mixamorig:"          # Mixamo naming (Tripo, Meshy, Mixamo, AccuRig exports)
[bones.map]                    # Mixamo role -> your bone name, for rigs named differently
# Hips = "pelvis"

[motion]
vmd = ""                       # the dance (required)
scale = 0.0                    # metres per MMD unit; 0 = auto: leg length / 9.42 (a standard MMD leg)
arm_angle = 37.0               # MMD's rest pose has the arms this many degrees below horizontal
center_height = 8.0            # height of the MMD センター pivot, MMD units
thumb_rest = []                # [along, across, palm]: a standard MMD hand's rest thumb direction in the
                               # hand's frame (left hand). MMD thumb keys assume it; set it when the rig's
                               # thumbs rest flatter (e.g. [0.838, 0.395, 0.377], measured on an MMD model).
                               # [] = use the rig's thumbs as they are
hands_apart = []               # [{start, end, ramp, gap}]: spread the wrists by `gap` m (arm IK) over a
                               # frame range, for hands that should touch but cross (larger hands than
                               # the motion was made for)

[camera]
vmd = ""                       # MMD camera motion; "" = a static front camera
track = ""                     # instead: a camera keyed from a track file (.npz: frames, loc, quat as
                               # w x y z, lens, sensor in mm), e.g. solved from a reference video
track_dancer = ""              # with track: key the rig object's place and heading from the track's
                               # rig_loc_<name> / rig_rotz_<name> ("" = the dancer stays put); keyed
                               # last, in the stage, after everything that works on the rest pose
resolution = [1920, 1080]
clip = [0.02, 200.0]
# Custom shots replace the MMD camera over a frame range (a camera tracking a look-at target):
# [[camera.shots]]
# name = "Intro"
# start = 0
# end = 110                    # first frame back on the MMD camera
# lens = 40
# fstop = 2.8                  # 0 = no depth of field
# keys = [[0, [-0.58, -0.98, 1.12], [0.04, -0.07, 0.47]],   # [frame, camera location, look-at]
#         [109, [-0.30, -1.26, 0.80], [0.04, -0.07, 0.50]]]

[audio]
file = ""                      # the song (.wav): a preview strip in Blender, and muxed into the MP4

[face]
mode = "none"                  # "none" | "atlas" (painted face texture) | "shapekeys"
vmd = ""                       # facial track; "" = the morph keys in the motion VMD

[face.morphs]                  # VMD morph names (standard MMD Japanese names)
blink = "まばたき"
wink_left = "ウィンク"          # the character's left eye
wink_right = "ウィンク右"
smile = "笑い"
a = "あ"
i = "い"
u = "う"
e = "え"
o = "お"
wa = "ワ"
smirk = "にやり"

[face.atlas]                   # mode = "atlas": expression tiles composited over the face painting
material = ""                  # the face material
texture = ""                   # face painting; "" = the image in `base_node`
base_node = ""                 # image node feeding the shader; "" = auto (the one linked to shader_input)
shader_node = ""               # node receiving the face colour; "" = auto
shader_input = "Base Color"
uv_node = ""                   # "" = auto (an existing UV Map node, else one is added)
mouth_min_hold = 2             # frames each mouth shape is held at least (no lip-sync flicker)
lids = "sample"                # eye states: "sample" (lid filled with skin sampled per column) or
                               # "inpaint" (the eye inpainted away first: soft lids, hair strands kept)
inpaint_hair = [25, 80, 160]   # lids = "inpaint": hair strands crossing the eye, kept in front of the lid
                               # (RGB 0-255: blue > red + a, blue > b, red < c; suits blue/violet hair)
inpaint_skin = [190, 6, 80]    # lids = "inpaint": skin the lid is filled from (brightest channel > a,
                               # a < red - blue < c; suits light skin)
clean = false                  # write a cleaned copy of the painting (halo_boxes / corner_box)
halo_boxes = []                # [[x0, y0, x1, y1], ...] grey projection halos to inpaint (texture px)
corner_box = []                # [x0, y0, x1, y1] block at an eye corner repainted as sclera/skin
corner_eye = "L"
skin_above = 34                # px of upper-lid skin above the lash band
cheek_below = 46               # px of cheek below the lower lid (smile)
mouth_center = [0, 0]          # texture px
mouth_rect = [0, 0, 0, 0]      # x0, y0, x1, y1
# eye guide curves (texture px, left to right), measured on the painting:
# [face.atlas.eyes.L]          # L = image-left eye (the character's right eye)
# lash_top = [[x, y], ...]     # upper edge of the painted lash band
# lash_bot = [[x, y], ...]     # lower edge of the lash band (top of the eye opening)
# lower    = [[x, y], ...]     # lower lid line
# [face.atlas.eyes.R]

[face.shapekeys]               # mode = "shapekeys"
object = ""                    # mesh with the shape keys; "" = the body
# map = { "まばたき" = "Blink", "あ" = "A" }   # VMD morph name -> shape key name

[hair]                         # bone chains through the hair mass, rooted on the head
enabled = false
material = ""                  # hair material (required when enabled)
rip_below = 0.86               # split hair/cloth seams below this height, so locks swing free
columns = 17
phi_range = [-150.0, 150.0]    # degrees round the head: 0 = back centre, + = character's left
rows_z = [0.86, 0.78, 0.70, 0.62, 0.54, 0.46, 0.38]   # joint heights, root -> tips
axis = [0.0, -0.03]            # x, y of the vertical axis the columns are laid round
root_band = 0.04               # hair above rows_z[0] + this rides the head bone only
min_count = 6                  # vertices a bin needs to extend a chain
adopt_head_islands = false     # islands of another material that follow the head (curls the
                               # auto-rigger gave the cloth material) join the hair chains
mode = "curtain"               # "curtain": columns round the head (rows_z, phi_range, columns);
                               # "locks": one chain per hair lock (keys below), unlinked between locks
split_z = 0.68                 # locks: below this height the separate pieces of the hair mesh are its locks
min_lock = 30                  # locks: vertices a piece needs to be a lock (smaller scraps follow the nearest)
lock_width = 16.0              # locks: degrees of arc per chain on a wide lock (a sheet of fused curls)
root_z = 0.78                  # locks: height of the first (pinned) joint of each chain
joint_step = 0.045             # locks: spacing of the joints down each chain (m)
max_joints = 9
smooth = 4                     # locks: smoothing passes of the weights over the hair surface

[skirt]                        # a ring of bone chains on the skirt's inner surface, rooted on the hips
enabled = false
materials = []                 # skirt materials; [] = every non-hair material below `top`
top = 0.66                     # cloth below this height (and not the legs) is skirt
columns = 24
rows_z = [0.64, 0.58, 0.52, 0.455, 0.39, 0.325, 0.26, 0.195, 0.13]   # waist -> hem
axis = [0.0, -0.02]

[legs]                         # finding the legs as their own mesh island (kept out of the skirt)
min_top = 0.5                  # the island reaches the floor and rises above this
max_abs_x = 0.12
attach = 0.0                   # islands lying within this distance of the legs (shoe buckles, straps)
                               # belong to them, not the skirt (m; 0 = off)

[overskirt]                    # a second, outer gown layer (open-front panels) on its own chains
enabled = false
ztop = 0.60                    # only fabric below this is tested for a layer underneath
min_gap = 0.006                # a panel joint always sits this far outside the skirt
min_vertices = 25              # vertices a column needs to get a panel chain
phi_range = []                 # [a0, a1] degrees (0 = front, + = character's left): only this arc
                               # may be the outer layer, e.g. an apron; [] = anywhere
zbottom = 0.0                  # with phi_range: and only fabric above this height (bows on the skirt
                               # below an apron stay on the skirt)

[tail]                         # a tail on its own bone chain, rooted on the hips (its own mesh island)
enabled = false
seed = [0.0, 0.2, 0.3]         # a point on or near the tail: the mesh island nearest to it is the tail
rows = 9                       # joints from the root (the end nearest the hips) to the tip
width = 0.03                   # the two side-by-side chains sit this far apart (gives the bones a twist)
pinned_rows = 2                # joints carried rigidly by the hips (the part inside the body/skirt)
sway = [0.0, 60.0, 4.0]        # [degrees at the tip, period, lag per joint (frames)]: a slow swish
                               # travelling down the tail on top of its physics; 0 degrees = off

[tail.physics]
relative = true
smooth_frames = 0.0
elastic = [1.0, 1.0, 0.45, 0.30, 0.22, 0.17, 0.14, 0.12, 0.10]
stiff_lim = [0.0, 0.0, 0.35, 0.45, 0.55, 0.6, 0.65, 0.7, 0.7]
lying_relax = 0.6
tether = [0.0, 0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35]
drag = 0.03
gravity_comp = 1.0
goal_lying = 1.0
ring_mode = "both"
ring_stiff = 1.0
bend_chain = 0.2
bend_min = 0.95
edge_collide = true
outer_rule = false

[hands]                        # rebuild fused hands from the finger bones (needs scikit-image)
enabled = false
material = ""                  # material slot of the hands (its faces are replaced, see `select`)
select = "material"            # "material": every face of `material` is the old hands; "wrist": only
                               # those past the wrists (a material shared with neck/chest skin)
wrist_margin = 0.004           # select = "wrist": how far before the wrist joint the hands start (m)
skin_uv = []                   # [u, v]: keep the material's texture and give the new hands this
                               # texel (a clean skin spot); [] = flat skin_color on the material
line_material = ""             # matching outline material, if any
skin_color = [0.937, 0.80, 0.74]   # linear RGB for the new hands
scale = 0.0                    # size of the hand model; 0 = auto from the hand bones
palm_plane_z = 0.0             # rest-pose palm mid-plane height; 0 = auto (wrist + knuckles)
voxel = 0.00038
decimate = 0.07
outline_weight = 0.55          # weight in the outline group for the new hands
phalanges = []                 # [proximal, middle, distal]: re-place each finger's joints to these length
                               # ratios, tip kept (auto-riggers space them evenly, so fingers bend in the
                               # wrong places), e.g. [1.0, 0.62, 0.55] as drawn hands; [] = the rig's joints
spread = 1.0                   # widen the knuckle row by this factor (auto-riggers crowd the fingers)

[fixes]                        # optional weight repairs for auto-rigged meshes
nape_seam = false              # hair/cloth seam at the nape: neck/head weights only
waist_z = []                   # [z0, z1]: move thigh weights to the hips between these heights
cross_side_legs_below = 0.0    # strip opposite-side leg weights below this height (0 = off)
rigid_boots = false            # partition the legs: thigh / shin / foot / toe with short blends
rigid_boots_hips = false       # with rigid_boots: a leg mesh reaching the pelvis blends into the hips there
unweighted = true              # vertices with no deform weight take their nearest neighbour's weights

[physics]
preroll = 90                   # frames held on the first pose before the dance (cloth settles)
substeps = 8
gravity = 0.0                  # m/s^2; 0 = 9.81 scaled to the character (scale / 0.08)
boxes = []                     # extra box colliders [x0, x1, y0, y1, top] (floor is always on)

[physics.skirt]
relative = true
smooth_frames = 0.0            # Gaussian sigma (frames) of a low-pass on the result, in the hips' frame:
                               # takes out contact jitter, keeps the swing (0 = off; no resim needed)
elastic = [1.0, 0.30, 0.16, 0.10, 0.08, 0.065, 0.055, 0.05, 0.045]
stiff_lim = [0.0, 0.55, 0.65, 0.75, 0.85, 0.95, 1.05, 1.15, 1.2]
lying_relax = 0.8
tether = [0.0, 0.2, 0.35, 0.5, 0.65, 0.8, 0.95, 1.1, 1.2]
drag = 0.02
gravity_comp = 0.85
goal_lying = 1.0
ring_mode = "range"
ring_min = 0.82
ring_max = 1.35
ring_stiff = [0.0, 0.5, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.75]
bend_chain = 0.25
bend_min = 0.95
bend_ring = 0.15
bend_ring_min = 0.7
edge_collide = true
outer_rule = true
radius = 0.012

[physics.overskirt]
relative = true
smooth_frames = 0.0            # Gaussian sigma (frames) of a low-pass on the result, in the hips' frame:
                               # takes out contact jitter, keeps the swing (0 = off; no resim needed)
elastic = [1.0, 0.28, 0.14, 0.09, 0.07, 0.06, 0.05, 0.045, 0.04]
stiff_lim = [0.0, 0.6, 0.72, 0.85, 0.95, 1.05, 1.12, 1.18, 1.22]
lying_relax = 0.8
tether = [0.0, 0.2, 0.35, 0.5, 0.65, 0.8, 0.95, 1.1, 1.2]
drag = 0.022
gravity_comp = 0.8
goal_lying = 1.0
ring_mode = "range"
ring_min = 0.75
ring_max = 1.4
ring_stiff = [0.0, 0.3, 0.25, 0.2, 0.18, 0.15, 0.15, 0.15, 0.15]
bend_chain = 0.25
bend_min = 0.95
bend_ring = 0.0
edge_collide = true
outer_rule = false
radius = 0.008

[physics.hair]
relative = false
smooth_frames = 0.0
goal = [1.0, 0.14, 0.09, 0.06, 0.045, 0.035, 0.03]
tether = [0.0, 0.06, 0.12, 0.18, 0.25, 0.32, 0.38]
drag = 0.015
gravity_comp = 1.0
goal_lying = 0.3
ring_stiff = 0.35
ring_mode = "both"
edge_collide = true
max_push = 0.05

[stage]
builder = "default"            # "default" (floor + backdrop), "set" (a set from another .blend,
                               # [stage.set] below) or a project module "room.py"
                               # defining build(collection, cfg) and optionally colliders(cfg) and
                               # finish(collection, cfg) (run last: the project's lights, look, camera)
steps = []                     # project files run on the built character before finish(), in order, each
                               # defining run(cfg, collection): a face rebuild, a prop, sleeves. Paths
                               # are relative to project.toml, so projects share one file
textures = {}                  # { image name = "cleaned copy.png" }: swap a texture file of the character
lining = {}                    # { material = [r, g, b] }: single-layer fabric gets this darker shade of
                               # its print on the inside (backfaces), seen when it flies up
key_follow = []                # [elevation, azimuth] degrees: the key sun follows the camera, from above it
                               # and turned round from it (a toon face stays lit as the dancer turns)
key_energy = 0.0               # with key_follow: the sun's strength (0 = as in the file)
key_link = false               # light only the character with the key sun (light linking)
world = ""                     # world datablock to use; "" = the scene's world (or a new one)
world_color = [1.0, 0.90, 0.80]
world_strength = 0.17
sun = ""                       # sun light to use; "" = the file's first sun, else a new "Stage_Sun"
sun_rotation = [50.0, 0.0, 30.0]   # degrees, only for a created sun
sun_energy = 4.0               # only for a created sun
sun_angle = 2.5
sun_color = [1.0, 0.95, 0.88]
floor_color = [0.62, 0.58, 0.56]
glow = true                    # compositor fog glow on bright areas
glow_threshold = 0.92
glow_strength = 0.45
glow_size = 0.55

[stage.set]                    # builder = "set": a set made in another .blend, appended around the dance
file = ""                      # the .blend
collections = []               # the collections to append; [] = all
world = ""                     # its world to use ("" = keep the stage world)
scale = 1.0                    # e.g. 0.625 for a real-size set around 1 m characters meant to read as 1.6 m
rotation = 0.0                 # degrees about Z
center_set = [0.0, 0.0]        # this floor point of the set (its own metres) ...
center_dance = [0.0, 0.0]      # ... goes here in the dance (a spot the dance and camera keep clear around)

[render]
engine = "BLENDER_EEVEE"
samples = 48
raytracing = true
trace_max_roughness = 0.4
fast_gi = false
shadow_pool = "512"            # MB of shadow maps; raise for a set with many shadowed lights
motion_blur = 0.0              # shutter in frames (0.5 suits fast camera whips); 0 = off. Makes EEVEE
                               # CPU-bound: render with more processes per GPU
filter_size = 1.1
view_transform = "Standard"    # toon colours as painted; AgX washes them out ("Khronos PBR Neutral"
                               # keeps them and rolls off a bright set's highlights)
look = "None"
exposure = 0.0
png_compression = 15

[encode]
crf = 14
preset = "slow"
tune = "animation"
audio_bitrate = "256k"
fade = 1.6                     # seconds of fade-out (picture and sound) at the end
fade_picture = true            # fade the picture too (false: only the sound)
song_end = "hold"              # "hold": a song longer than the dance plays on over the last frame;
                               # "cut": the video ends with the dance, the song cut (and faded) there
parts = []                     # [{ start = 338, frames = "../chatgpt/render/frames/dw_" }]: from frame
                               # `start` on, take the frames from another project's render (prefix as
                               # paths.frames, relative to this project.toml): characters taking turns
copies = []                    # smaller copies next to the video, e.g.
                               # { suffix = "_preview_720p", height = 720, crf = 20 } or
                               # { suffix = "_10MB", height = 720, max_mb = 10, audio_bitrate = "112k" }
                               # (two-pass to fit under max_mb; or bitrate = "680k" to set it),
                               # tune = "" for none (default: encode.tune)
